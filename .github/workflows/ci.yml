# Runs on every push and pull request. A red X on a commit means something broke.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App — typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
        env:
          # Build-time placeholders only; the real values live in the hosting settings.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: Database — replay all migrations + RLS security suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: ./db-tests/run.sh

  edge-functions:
    name: Edge functions — type-check + unsubscribe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check (functions that are clean today; add others as they're fixed)
        working-directory: supabase/functions
        run: |
          for f in create-checkout-session create-portal-session delete-my-account stripe-webhook \
                   send-email send-message-notification send-team-invite-notification email-unsubscribe; do
            echo "::group::$f"; deno check "$f/index.ts"; echo "::endgroup::"
          done
      - name: Unsubscribe token parity
        run: deno test --allow-read --allow-env supabase/functions/tests/unsubscribe_token_test.ts
      - name: Unsubscribe end-to-end
        run: deno run --allow-net --allow-env --allow-read supabase/functions/tests/email_unsubscribe_e2e.ts
